[service]
bind = "127.0.0.1:8787"
default_batch_limit = 5

[[profiles]]
id = "wiiu"
name = "Wii U retail NUS"
system = "wiiu"
source_format = "nus-7z"
source_dir = "/mnt/roms/wiiu/incoming"
done_dir = "/mnt/roms/wiiu/done"
work_dir = "/mnt/fast/rom-pipeline/wiiu/work"
state_dir = "/mnt/fast/rom-pipeline/wiiu/state"
log_dir = "/mnt/fast/rom-pipeline/wiiu/logs"
output_dir = "/mnt/fast/rom-pipeline/wiiu/wua"
library_dir = "/mnt/roms/wiiu/library"
output_format = "wua"
batch_limit = 5

[profiles.wiiu]
manifest = "/var/lib/rom-pipeline/wiiu/manifest.tsv"
cdecrypt = "/usr/local/libexec/rom-pipeline/wiiu/cdecrypt"
zarchive = "/usr/local/libexec/rom-pipeline/wiiu/zarchive"
wait_seconds = 60
source_service = "archive-wiiu-download.service"

[[profiles]]
id = "gamecube"
name = "Nintendo GameCube disc images"
system = "gamecube"
source_format = "iso"
source_dir = "/mnt/roms/gamecube/incoming"
done_dir = "/mnt/roms/gamecube/done"
work_dir = "/mnt/fast/rom-pipeline/gamecube/work"
state_dir = "/mnt/fast/rom-pipeline/gamecube/state"
log_dir = "/mnt/fast/rom-pipeline/gamecube/logs"
output_dir = "/mnt/fast/rom-pipeline/gamecube/rvz"
library_dir = "/mnt/roms/gamecube/library"
output_format = "rvz"
batch_limit = 5

[profiles.gamecube]
manifest = "/var/lib/rom-pipeline/gamecube/manifest.tsv"
dolphin_tool = "/usr/games/dolphin-tool"
block_size = 131072
compression = "zstd"
compression_level = 5
verify_round_trip = true

[[profiles]]
id = "3ds"
name = "Nintendo 3DS installable archives"
system = "3ds"
source_format = "zip-3ds"
source_dir = "/mnt/fast/rom-pipeline/3ds/downloads"
done_dir = "/mnt/fast/rom-pipeline/3ds/downloads/done"
work_dir = "/mnt/fast/rom-pipeline/3ds/work"
state_dir = "/mnt/fast/rom-pipeline/3ds/state"
log_dir = "/mnt/fast/rom-pipeline/3ds/logs"
output_dir = "/mnt/fast/rom-pipeline/3ds/cia"
library_dir = "/mnt/roms/3ds/library"
output_format = "cia"
batch_limit = 5

[profiles.3ds]
manifest = "/var/lib/rom-pipeline/3ds/manifest.tsv"
seven_zip = "/usr/bin/7z"
python = "/usr/bin/python3"
converter = "/usr/local/libexec/rom-pipeline/3ds/3dsconv.py"
ctrtool = "/usr/local/libexec/rom-pipeline/3ds/ctrtool"
normalize_crypto_flags = true

[[profiles]]
id = "psp"
name = "Sony PSP disc images"
system = "psp"
source_format = "iso"
source_dir = "/mnt/roms/psp/incoming"
done_dir = "/mnt/roms/psp/done"
work_dir = "/mnt/fast/rom-pipeline/psp/work"
state_dir = "/mnt/fast/rom-pipeline/psp/state"
log_dir = "/mnt/fast/rom-pipeline/psp/logs"
output_dir = "/mnt/fast/rom-pipeline/psp/chd"
library_dir = "/mnt/roms/psp/library"
output_format = "chd"
batch_limit = 5

[profiles.psp]
chdman = "/usr/bin/chdman"
codec = "zstd"
hunk_size = 2048
verify_round_trip = true

[[profiles]]
id = "ps2"
name = "PlayStation 2 disc images"
system = "ps2"
source_format = "disc-image"
source_dir = "/mnt/roms/ps2/incoming"
done_dir = "/mnt/roms/ps2/done"
work_dir = "/mnt/fast/rom-pipeline/ps2/work"
state_dir = "/mnt/fast/rom-pipeline/ps2/state"
log_dir = "/mnt/fast/rom-pipeline/ps2/logs"
output_dir = "/mnt/fast/rom-pipeline/ps2/games"
library_dir = "/mnt/roms/ps2/library"
output_format = "mixed"
batch_limit = 5

[profiles.ps2]
manifest = "/var/lib/rom-pipeline/ps2/manifest.tsv"
chdman = "/usr/bin/chdman"
minimum_savings_percent = 10
preserve_when_compression_is_not_worthwhile = true
verify_round_trip = true

[[profiles]]
id = "vita"
name = "PlayStation Vita native deployments"
system = "vita"
source_format = "nonpdrm-zip"
source_dir = "/mnt/fast/rom-pipeline/vita/downloads"
done_dir = "/mnt/fast/rom-pipeline/vita/downloads/done"
work_dir = "/mnt/fast/rom-pipeline/vita/work"
state_dir = "/mnt/fast/rom-pipeline/vita/state"
log_dir = "/mnt/fast/rom-pipeline/vita/logs"
output_dir = "/mnt/fast/rom-pipeline/vita/records"
library_dir = "/media/user/SD2VITA"
output_format = "native-vita-tree"
batch_limit = 1

[profiles.vita]
seven_zip = "/usr/bin/7z"
mountpoint = "/usr/bin/mountpoint"
reserve_bytes = 20000000000
